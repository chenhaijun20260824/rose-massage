<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地数据检查 - 玫瑰按摩</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #FFF5F7; color: #333; min-height: 100vh; padding: 20px; }
.container { max-width: 640px; margin: 0 auto; }
.header { background: linear-gradient(135deg, #C2185B, #E91E63); color: #fff; padding: 16px; text-align: center; border-radius: 12px; margin-bottom: 20px; }
.card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
.row b { color: #C2185B; }
pre { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 10px; max-height: 240px; overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
button { margin-top: 10px; padding: 10px 16px; border: none; border-radius: 8px; background: #C2185B; color: #fff; font-size: 14px; cursor: pointer; }
button.ghost { background: #eee; color: #666; }
.back-link { text-align: center; margin-top: 16px; }
.back-link a { color: #C2185B; text-decoration: none; }
</style>
<script>window.imgErr=function(img){try{img.onerror=null;img.src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 280 220'><rect width='280' height='220' fill='%23fce4ec'/><text x='140' y='125' font-size='40' text-anchor='middle' fill='%23C2185B'>暂无图片</text></svg>";}catch(e){}};</script>
</head>
<body>
<div class="container">
<div class="header">🗄️ 本地数据检查</div>
<div class="card" id="bins"></div>
<div class="card">
<div class="row"><span>当前登录用户</span><b id="curUser">-</b></div>
<button class="ghost" onclick="showRaw()">查看原始 JSON</button>
<pre id="raw" style="display:none;"></pre>
</div>
<div class="card">
<button onclick="clearAll()">清空全部本地数据</button>
<button class="ghost" onclick="location.reload()">刷新</button>
</div>
<div class="back-link"><a href="index.html">← 返回首页</a></div>
</div>
<script>
var BINS = ['accounts','technicians','notices','audit_log'];
function load(k){ try { return JSON.parse(localStorage.getItem('rose_'+k) || '[]'); } catch(e){ return []; } }
function render(){
  var html = '';
  BINS.forEach(function(k){
    var arr = load(k);
    html += '<div class="row"><span>rose_'+k+'</span><b>'+arr.length+' 条</b></div>';
  });
  document.getElementById('bins').innerHTML = html;
  var u = localStorage.getItem('rose_current_user');
  document.getElementById('curUser').textContent = u ? '(已登录)' : '(未登录)';
}
function showRaw(){
  var all = {};
  BINS.forEach(function(k){ all[k] = load(k); });
  all._current_user = localStorage.getItem('rose_current_user');
  var el = document.getElementById('raw');
  el.style.display = 'block';
  el.textContent = JSON.stringify(all, null, 2);
}
function clearAll(){
  if (!confirm('确定清空全部本地数据？此操作不可恢复。')) return;
  BINS.forEach(function(k){ localStorage.removeItem('rose_'+k); localStorage.removeItem('rose_deleted_'+k); });
  localStorage.removeItem('rose_current_user');
  location.reload();
}
render();
</script>
</body>
</html>
