<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
/*
 * rose-sync.js — 本地优先同步核心库（取代 jsonbin.js）
 * 架构：本地优先（localStorage 永远可用），可选接入轻量后端做多端同步。
 * 默认不接任何云端：零额度、零网络依赖、不会弹"密钥失败"红条。
 * 多端同步：给 window.RoseSyncAdapter 赋值适配器即可（见 sync-adapter.js 示例）。
 */
var JB = {
  BINS: { accounts: 'accounts', technicians: 'technicians', notices: 'notices', audit_log: 'audit_log' },
  _adapterNow: function () {
    try { return (typeof window !== 'undefined' && window.RoseSyncAdapter) ? window.RoseSyncAdapter : null; }
    catch (e) { return null; }
  },
  _storageKey: function (binKey) { return 'rose_' + binKey; },
  _unwrap: function (v) {
    var depth = 0;
    while (depth < 5 && v && typeof v === 'object' && 'record' in v && Object.keys(v).length <= 2) { v = v.record; depth++; }
    return v;
  },
  _getLocal: function (binKey) {
    try {
      var v = localStorage.getItem(this._storageKey(binKey));
      if (!v) return [];
      return this._unwrap(JSON.parse(v));
    } catch (e) { return []; }
  },
  _setLocal: function (binKey, data) {
    try {
      localStorage.setItem(this._storageKey(binKey), JSON.stringify(data));
      return true;
    } catch (e) {
      if (typeof toast === 'function') toast('本地存储已满，请清理浏览器缓存');
      return false;
    }
  },
  _mergeLists: function (localArr, cloudArr, binKey) {
    var self = this;
    var delSet = {};
    if (binKey) self.getDeleted(binKey).forEach(function (id) { delSet[id] = true; });
    var map = {}, noKey = [];
    function ts(it) { return (it && (it.updateTime || it.time || it.registerTime)) || 0; }
    function keyOf(it) { return it && (it.id || it.account || it.accountId); }
    function isDel(it) { var k = keyOf(it); return k && delSet[k]; }
    function add(it) {
      if (!it || typeof it !== "object") return;
      if (isDel(it)) return;
      var k = keyOf(it);
      if (!k) { noKey.push(it); return; }
      if (!map[k]) map[k] = [it, ts(it)];
      else if (ts(it) > map[k][1]) map[k] = [it, ts(it)];
    }
    (Array.isArray(cloudArr) ? cloudArr : []).forEach(add);
    (Array.isArray(localArr) ? localArr : []).forEach(add);
    var out = [];
    Object.keys(map).forEach(function (k) { out.push(map[k][0]); });
    return out.concat(noKey);
  },
  get: function (binKey, cb) {
    var self = this;
    var local = this._getLocal(binKey);
    var adapter = this._adapterNow();
    if (adapter && typeof adapter.pull === "function") {
      var settled = false;
      var finish = function (cloudArr, ok) {
        if (settled) return; settled = true;
        if (ok && Array.isArray(cloudArr)) {
          var merged = self._mergeLists(local, cloudArr, binKey);
          self._setLocal(binKey, merged);
          cb(merged, true, cloudArr);
        } else {
          cb(local, false, local);
        }
      };
      adapter.pull(binKey, finish);
      setTimeout(function () { finish(local, false); }, 2500);
    } else {
      setTimeout(function () { cb(local, true, local); }, 0);
    }
  },
  put: function (binKey, data, cb) {
    this._setLocal(binKey, data);
    var adapter = this._adapterNow();
    if (adapter && typeof adapter.push === "function") {
      var settled = false;
      var finish = function (ok) { if (settled) return; settled = true; if (typeof cb === "function") cb(ok); };
      adapter.push(binKey, data, finish);
      setTimeout(function () { finish(false); }, 2500);
    } else {
      if (typeof cb === "function") setTimeout(function () { cb(true); }, 0);
    }
  },
  syncAll: function (cb) {
    var adapter = this._adapterNow();
    if (!adapter) { if (typeof cb === "function") cb(true); return; }
    var self = this, keys = ["accounts", "technicians", "notices", "audit_log"], pending = keys.length;
    function done() { pending--; if (pending <= 0 && typeof cb === "function") cb(true); }
    keys.forEach(function (k) {
      var snapshot = self._getLocal(k);
      self.get(k, function (mergedArr, ok, rawArr) {
        if (!ok) { done(); return; }
        if (!Array.isArray(rawArr)) rawArr = [];
        var merged = self._mergeLists(snapshot, rawArr, k);
        var same = JSON.stringify(merged) === JSON.stringify(rawArr);
        if (same) done();
        else self.put(k, merged, function () { done(); });
      });
    });
  },
  getCurrentUser: function () {
    try { var raw = localStorage.getItem("rose_current_user"); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  },
  genId: function () {
    var ts = Date.now().toString(36);
    var r1 = Math.random().toString(36).slice(2);
    var r2 = "";
    try { r2 = crypto.getRandomValues(new Uint32Array(1))[0].toString(36); }
    catch (e) { r2 = Math.random().toString(36).slice(2); }
    return ts + r1 + r2;
  },
  _deletedKey: function (binKey) { return 'rose_deleted_' + binKey; },
  getDeleted: function (binKey) {
    try { return JSON.parse(localStorage.getItem(this._deletedKey(binKey)) || "[]"); } catch (e) { return []; }
  },
  markDeleted: function (binKey, id) {
    if (!id) return;
    var d = this.getDeleted(binKey);
    if (d.indexOf(id) < 0) d.push(id);
    try { localStorage.setItem(this._deletedKey(binKey), JSON.stringify(d)); } catch (e) {}
  },
  unmarkDeleted: function (binKey, id) {
    var d = this.getDeleted(binKey).filter(function (x) { return x !== id; });
    try { localStorage.setItem(this._deletedKey(binKey), JSON.stringify(d)); } catch (e) {}
  }
};

// 页面加载后如有适配器则静默同步；纯本地模式下直接 no-op（不联网、不弹窗）
setTimeout(function () { try { JB.syncAll(); } catch (e) {} }, 800);

// 全局错误捕获（保留，便于排查）
window.onerror = function (m, s, l, c) {
  try {
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:#c00;color:#fff;font-size:12px;padding:8px;z-index:99999;white-space:pre-wrap;";
    d.textContent = "页面报错: " + m + " (" + l + ":" + c + ")";
    (document.body || document.documentElement).appendChild(d);
  } catch (e) {}
  return false;
};

/*
 * 可选多端同步：在引入本文件之后、页面逻辑之前设置 window.RoseSyncAdapter 即可，
 * 例如 sync-adapter.js。本地永远优先，后端不可用也不影响本机数据。
 */
</script>
<script>
/* ============================================================
 * 内嵌 GitHub 令牌（与首页一致）：后台审核数据直接写入共享 Gist
 * 安全提示：令牌写在文件里，谁拿到本文件谁就能访问你的 Gist，勿外传
 * ============================================================ */
// ROSE_GH_PAT configured via setup-token.html
var ROSE_GH_GIST = "335732b242ed305912b3a3d5c6ce9dc1";
</script>
<script>
/*
 * sync-adapter.js — GitHub Gist 后端适配器（本地优先 + 多端同步）
 * 由 setup-token.html 把 GitHub PAT / Gist ID 写入 localStorage 后自动启用。
 * 未配置时本文件直接 return，页面退化为纯本地（零网络、不报错）。
 *
 * 存储模型：一个公开 Gist，内含单个文件 rose-sync.json = {
 *   accounts:[...], technicians:[...], notices:[...], audit_log:[...],
 *   __deleted:{ accounts:[id...], technicians:[id...], ... }   // 墓碑，跨端传播删除
 * }
 *
 * 读取：公开接口（gist.github.com，无需 token），所有设备打开即可读数据
 * 写入：需认证 PATCH（保护数据不被任意篡改），写入前先读最新版避免覆盖
 *
 * 适配器对外满足 rose-sync.js 的契约：
 *   pull(binKey, cb)      -> cb(array, ok, deletedIds)
 *   push(binKey, data, deletedIds, cb) -> cb(ok)
 */
(function () {
  var TOKEN_KEY = 'rose_gh_token';
  var GIST_KEY  = 'rose_gh_gist';
  var BASE_KEY  = 'rose_gh_api_base';
  var FILE = 'rose-sync.json';
  var BINS = ['accounts', 'technicians', 'notices', 'audit_log'];
  var DESCRIPTION = 'rose-massage 本地优先同步存储（公开版）';
  var DEFAULT_GIST_ID = '335732b242ed305912b3a3d5c6ce9dc1'; // 公开数据 Gist，所有设备共用

  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var token = lsGet(TOKEN_KEY);
  var base = lsGet(BASE_KEY) || 'https://api.github.com';
    // 迁移：清掉旧账号遗留的不可写 Gist ID，强制改用新账号共享 Gist
  (function () {
    var cached = lsGet(GIST_KEY);
    if (cached && cached !== DEFAULT_GIST_ID) {
      try { localStorage.removeItem(GIST_KEY); } catch (e) {}
    }
  })();
  var gistId = lsGet(GIST_KEY) || DEFAULT_GIST_ID; // 首次无 localStorage 则用默认 Gist（公开可读）
  var hasToken = !!(token && token.trim());

  // 令牌优先级：localStorage（配置页/连接云端写入）> 页面内嵌 ROSE_GH_PAT（首页/后台复用）
  // validPat 校验 ghp_ / github_pat_ 前缀，占位符（“在此填入…”）自动忽略
  function validPat(t) {
    t = String(t || '').trim();
    if (t.indexOf('ghp_') === 0 || t.indexOf('github_pat_') === 0) return t;
    return '';
  }
  var DEFAULT_PAT = (typeof window !== 'undefined' && window.ROSE_GH_PAT) ? validPat(window.ROSE_GH_PAT) : '';
  token = validPat(token) || DEFAULT_PAT;
  hasToken = !!token;

  function headers() {
    return {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }
  function fileObj(content) { var o = {}; o[FILE] = { content: content }; return o; }

  // 认证请求（读取+写入均需认证）
  function api(path, method, body) {
    return fetch(base + path, {
      method: method || 'GET',
      headers: headers(),
      body: body ? JSON.stringify(body) : undefined
    });
  }

  // 读取 gist 全部 bins -> obj 或 null
  // 无 token 时：用公开 gist.github.com 接口（无需认证，任何设备可读）
  // 有 token 时：用认证 API（获取最新 raw_url）
  function readAll(cb) {
    if (!gistId) return cb(null);
    if (!hasToken) {
      // 公开接口：通过 gist.github.com 获取文件列表 → raw_url → 内容
      fetch('https://gist.github.com/' + gistId, { headers: { 'Accept': 'application/json' } })
        .then(function (r) { if (!r.ok) return cb(null); return r.json(); })
        .then(function (d) {
          if (!d || !d.files || !d.files[FILE]) return cb(null);
          var rawUrl = d.files[FILE].raw_url;
          if (!rawUrl) return cb(null);
          return fetch(rawUrl);
        })
        .then(function (r) { if (!r || !r.ok) return cb(null); return r.text(); })
        .then(function (txt) {
          try { cb(JSON.parse(txt)); } catch (e) { cb(null); }
        })
        .catch(function () { cb(null); });
    } else {
      // 认证接口：获取最新 raw_url 再拉内容（确保拿到最新版本）
      api('/gists/' + gistId, 'GET').then(function (r) {
        if (!r.ok) return cb(null);
        return r.json().then(function (d) {
          var f = d.files && d.files[FILE];
          var rawUrl = f && f.raw_url;
          if (!rawUrl) return cb(null);
          return fetch(rawUrl);
        }).then(function (r) { if (!r || !r.ok) return cb(null); return r.text(); })
        .then(function (txt) { try { cb(JSON.parse(txt)); } catch (e) { cb(null); } })
        .catch(function () { cb(null); });
      }).catch(function () { cb(null); });
    }
  }

  // 写入 gist 全部 bins（需认证 PATCH）
  function writeAll(obj, cb) {
    if (!hasToken) { cb(false); return; } // 无 token 不能写
    var content = JSON.stringify(obj);
    var doWrite = function (id) {
      api('/gists/' + id, 'PATCH', { files: fileObj(content) }).then(function (r) {
        cb(!!(r && r.ok));
      }).catch(function () { cb(false); });
    };
    if (gistId) return doWrite(gistId);
    // 首次：查找同令牌已有 gist 或新建公开 gist
    resolveGist(function (id) {
      if (!id) return cb(false);
      gistId = id;
      doWrite(gistId);
    });
  }

  // 用固定 description 在同一 GitHub 账号下查找/复用同一个 gist，实现多设备自动共享
  function findExistingGist(scanCb) {
    api('/user/gists?per_page=100', 'GET').then(function (r) {
      if (!r.ok) return scanCb(null);
      return r.json().then(function (list) {
        var found = null;
        (list || []).forEach(function (g) { if (g.description === DESCRIPTION) found = g.id; });
        scanCb(found);
      });
    }).catch(function () { scanCb(null); });
  }
  function resolveGist(cb) {
    if (gistId) return cb(gistId);
    findExistingGist(function (existing) {
      if (existing) { gistId = existing; lsSet(GIST_KEY, gistId); return cb(gistId); }
      api('/gists', 'POST', { description: DESCRIPTION, public: true, files: fileObj('{}') }).then(function (r) {
        if (!r.ok) return cb(null);
        return r.json().then(function (d) { gistId = d.id; lsSet(GIST_KEY, gistId); cb(gistId); });
      }).catch(function () { cb(null); });
    });
  }
  window.RoseSyncResolve = resolveGist;

  // 自动静默拉取：页面加载时立即拉取云端数据并【合并】写入本地存储
  // 合并而非覆盖：云端空/旧数据不会冲掉本地新数据（注册/审核结果）
  function autoPull() {
    if (!gistId) return;
    readAll(function (obj) {
      if (!obj) return;
      ['accounts', 'technicians', 'notices', 'audit_log'].forEach(function (bin) {
        var key = 'rose_' + bin;
        var arr = obj[bin];
        if (!Array.isArray(arr)) return;
        try {
          var localArr = [];
          var raw = localStorage.getItem(key);
          if (raw) { try { localArr = JSON.parse(raw); } catch (e) { localArr = []; } }
          var merged;
          if (window.JB && JB._mergeLists && Array.isArray(localArr)) {
            merged = JB._mergeLists(localArr, arr, bin); // 本地优先 + 云端补充 + 本地墓碑过滤
          } else {
            merged = arr;
          }
          localStorage.setItem(key, JSON.stringify(merged));
        } catch (e) {}
      });
      // 墓碑传播：云端删除同步到本地
      var del = obj.__deleted;
      if (del && window.JB && JB.markDeleted) {
        Object.keys(del).forEach(function (bin) {
          var ids = del[bin];
          if (!Array.isArray(ids)) return;
          ids.forEach(function (id) { try { JB.markDeleted(bin, id); } catch (e) {} });
        });
      }
      try { localStorage.setItem('rose_cloud_version', String(Date.now())); } catch (e) {}
    });
  }

  // 页面加载后立即拉取（早于 800ms 的 syncAll；主动触发一次）
  if (window.JB) { JB.autoPull = autoPull; JB.autoPull(); }
  window.addEventListener('load', function () { setTimeout(function () { if (window.JB && JB.autoPull) JB.autoPull(); }, 50); });

  // 写入串行化，避免并发 push 互相覆盖（每个 push 都是 读-改-写）
  var chain = Promise.resolve();

  window.RoseSyncAdapter = {
    endpoint: base + '/gists/' + gistId,
    pull: function (binKey, cb) {
      readAll(function (obj) {
        if (!obj) return cb([], false, []);
        var del = (obj.__deleted && Array.isArray(obj.__deleted[binKey])) ? obj.__deleted[binKey] : [];
        var arr = obj[binKey];
        cb(Array.isArray(arr) ? arr : [], true, del);
      });
    },
    push: function (binKey, data, deletedIds, cb) {
      chain = chain.then(function () {
        return new Promise(function (resolve) {
          readAll(function (cur) {
            var obj = cur || {};
            BINS.forEach(function (b) { if (!(b in obj)) obj[b] = []; });
            obj[binKey] = data;
            obj.__deleted = obj.__deleted || {};
            obj.__deleted[binKey] = deletedIds || [];
            writeAll(obj, function (ok) { resolve(ok); });
          });
        });
      }).then(function (ok) { if (typeof cb === 'function') cb(ok); },
               function () { if (typeof cb === 'function') cb(false); });
    }
  };
})();

</script>

<body>
<div class="header">🌹 管理员后台 <span id="cloudBadge" class="cloud-badge" style="display:none;"></span></div>
<div style="text-align:center;font-size:11px;color:#999;margin:4px 0 10px;">v2.2 · 限速修复版 · 2026-08-15</div>
<div id="loginView">
<div class="login-box">
<div style="text-align:center;font-size:15px;margin-bottom:16px;color:#666;">请输入管理员密码</div>
<input type="password" id="adminPwd" placeholder="管理员密码" onkeydown="if(event.key==='Enter')adminLogin()">
<button class="btn" onclick="adminLogin()">进入后台</button>
<div class="back-link" style="margin-top:14px;"><a href="index.html?v=20260817">← 返回首页</a></div>
</div>
</div>
<div id="adminView" style="display:none;">
<div class="container">
<div class="info-bar" id="infoBar">☁️ 正在连接云端...</div>
<div class="tabs">
<div class="tab active" id="tabReview" onclick="switchTab('review')">待审核 <span id="pendingCount"></span></div>
<div class="tab" id="tabHistory" onclick="switchTab('history')">审核记录 <span id="historyCount"></span></div>
<div class="tab" id="tabAll" onclick="switchTab('all')">全部技师</div>
<div class="tab" id="tabNotice" onclick="switchTab('notice')">公告</div>
</div>
<div class="toolbar">
<button class="btn btn-sm btn-ghost" onclick="loadAll()">🔄 刷新</button>
</div>
<div id="reviewPanel"><div id="pendingList"><div class="loading">加载中...</div></div></div>
<div id="historyPanel" style="display:none;"><div id="historyList"><div class="loading">加载中...</div></div></div>
<div id="allPanel" style="display:none;"><div id="allList"><div class="loading">加载中...</div></div></div>
<div id="noticePanel" style="display:none;">
<div class="card">
<input class="form-input" id="noticeTitle" placeholder="公告标题">
<textarea class="form-textarea" id="noticeContent" placeholder="公告内容（支持多行）"></textarea>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
  <div style="flex:1;min-width:80px;text-align:center;">
    <div id="nImg1Box" style="width:72px;height:72px;border:2px dashed #e0e0e0;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:28px;margin:0 auto;overflow:hidden;background:#fafafa;" onclick="document.getElementById('nImg1').click()">+</div>
    <input type="file" id="nImg1" accept="image/*" style="display:none" onchange="previewNoticeImg(this,'nImg1Box')">
  </div>
  <div style="flex:1;min-width:80px;text-align:center;">
    <div id="nImg2Box" style="width:72px;height:72px;border:2px dashed #e0e0e0;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:28px;margin:0 auto;overflow:hidden;background:#fafafa;" onclick="document.getElementById('nImg2').click()">+</div>
    <input type="file" id="nImg2" accept="image/*" style="display:none" onchange="previewNoticeImg(this,'nImg2Box')">
  </div>
  <div style="flex:1;min-width:80px;text-align:center;">
    <div id="nImg3Box" style="width:72px;height:72px;border:2px dashed #e0e0e0;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:28px;margin:0 auto;overflow:hidden;background:#fafafa;" onclick="document.getElementById('nImg3').click()">+</div>
    <input type="file" id="nImg3" accept="image/*" style="display:none" onchange="previewNoticeImg(this,'nImg3Box')">
  </div>
</div>
<button class="btn" onclick="addNotice()">发布公告</button>
</div>
<div id="noticeList"><div class="loading">加载中...</div></div>
</div>
<div class="back-link" style="margin-top:20px;">
<a href="index.html?v=20260817">← 返回首页</a> &nbsp;|&nbsp; <a href="javascript:adminLogout()">退出后台</a>
</div>
</div>
</div>

<script>
var ADMIN_PWD = 'admin123';
var TECH_KEY = 'technicians';
var LOG_KEY = 'audit_log';
var NOTICE_KEY = 'notices';
var cloudOk = false;

function toast(msg) {
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2200);
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function formatTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function setCloudBadge(ok, text) {
  var badge = document.getElementById('cloudBadge');
  var infoBar = document.getElementById('infoBar');
  if (ok) {
    badge.style.display = 'inline-block';
    badge.className = 'cloud-badge';
    badge.textContent = '云端已连接';
    infoBar.innerHTML = '☁️ 云端已连接 | 数据多设备同步';
  } else {
    badge.style.display = 'inline-block';
    badge.className = 'cloud-badge offline';
    badge.textContent = '本地模式';
    infoBar.innerHTML = '⚠️ 云端连接失败，使用本地数据（请检查网络）';
  }
}

function adminLogin() {
  var pwd = document.getElementById('adminPwd').value;
  if (pwd === ADMIN_PWD) {
    try { localStorage.setItem('rose_admin_logged', '1'); } catch(e) {}
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('adminView').style.display = 'block';
    loadAll();
  } else {
    toast('密码错误');
  }
}

function adminLogout() {
  if (confirm('确定退出？')) {
    try { localStorage.removeItem('rose_admin_logged'); } catch(e) {}
    location.reload();
  }
}

function loadAll() {
  document.getElementById('pendingList').innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById('historyList').innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById('allList').innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById('noticeList').innerHTML = '<div class="loading">加载中...</div>';

  var count = 0;
  var total = 3;
  var techs = [], logs = [], notes = [];

  // 本地优先：先用本地数据立即渲染（不等待云端），云端合并完成后自动重渲染
  try {
    var lt = JB._getLocal(TECH_KEY) || [];
    var ll = JB._getLocal(LOG_KEY) || [];
    var ln = JB._getLocal(NOTICE_KEY) || [];
    renderPending(lt); renderAll(lt); renderHistory(ll); renderNotices(ln); updateCounts(lt, ll);
  } catch (e) { console.warn('[loadAll] 本地渲染失败', e); }

  function check() {
    if (++count === total) {
      renderPending(techs); renderAll(techs); renderHistory(logs); renderNotices(notes); updateCounts(techs, logs);
    }
  }

  JB.get(TECH_KEY, function(data) { techs = Array.isArray(data) ? data : []; check(); });
  JB.get(LOG_KEY, function(data) { logs = Array.isArray(data) ? data : []; check(); });
  JB.get(NOTICE_KEY, function(data) { notes = Array.isArray(data) ? data : []; check(); });
}

function updateCounts(techs, logs) {
  var pending = (techs || []).filter(function(t) { return t.status === '待审核'; });
  document.getElementById('pendingCount').textContent = pending.length ? '(' + pending.length + ')' : '';
  document.getElementById('historyCount').textContent = (logs || []).length ? '(' + (logs || []).length + ')' : '';
}

function renderCard(t, showButtons, showDelete, showTop) {
  var imgs = (t.photos || []).map(function(p) { return '<img src="' + p + '" onerror="imgErr(this)">'; }).join('');
  var statusColor = t.status === '已通过' ? '#2E7D32' : t.status === '已拒绝' ? '#F44336' : '#FF9800';
  var btns = '';
  if (showButtons) {
    btns = '<div class="row-btns"><button class="btn btn-pass btn-sm" onclick="approve(\'' + t.id + '\')">✅ 通过</button><button class="btn btn-reject btn-sm" onclick="reject(\'' + t.id + '\')">❌ 拒绝</button></div>';
  }
  if (showDelete) {
    btns += '<div class="row-btns" style="margin-top:6px;"><button class="btn btn-sm" style="background:#9E9E9E;color:#fff;" onclick="delTech(\'' + t.id + '\')">🗑 删除该技师</button></div>';
  if (showTop) {
    var topBtn = t.top
      ? '<button class="btn btn-sm" style="background:#FF9800;color:#fff;" onclick="topTech(\'' + t.id + '\')">取消置顶</button>'
      : '<button class="btn btn-sm" style="background:#FF9800;color:#fff;" onclick="topTech(\'' + t.id + '\')">置顶</button>';
    btns += '<div class="row-btns" style="margin-top:6px;">' + topBtn + '</div>';
  }
  }
  return '<div class="card"><div class="tech-imgs">' + (imgs || '<div style="color:#bbb;font-size:12px;padding:8px;">无照片</div>') + '</div><div class="tech-field"><b>姓名：</b>' + escapeHtml(t.name) + ' <span style="color:' + statusColor + ';font-size:12px;">[' + escapeHtml(t.status || '待审核') + ']</span></div><div class="tech-field"><b>电话：</b>' + escapeHtml(t.phone) + '</div><div class="tech-field"><b>地址：</b>' + escapeHtml(t.address) + '</div><div class="tech-field"><b>价格：</b>¥' + escapeHtml(t.price) + ' / 次</div><div class="tech-field"><b>项目：</b>' + escapeHtml(Array.isArray(t.services) ? t.services.filter(Boolean).join('、') : (t.services || '')) + '</div><div class="tech-field" style="color:#888;"><b>账号：</b>' + escapeHtml(t.account || '') + '</div><div class="tech-field" style="color:#888;"><b>提交：</b>' + formatTime(t.submitTime) + '</div>' + btns + '</div>';
}

function renderPending(list) {
  var pending = list.filter(function(t) { return t.status === '待审核'; });
  var box = document.getElementById('pendingList');
  if (pending.length === 0) { box.innerHTML = '<div class="empty">⭐ 暂无待审核申请</div>'; return; }
  box.innerHTML = pending.map(function(t) { return renderCard(t, true, false); }).join('');
}

function renderAll(list) {
  var box = document.getElementById('allList');
  if (list.length === 0) { box.innerHTML = '<div class="empty">暂无技师数据</div>'; return; }
  box.innerHTML = list.map(function(t) { return renderCard(t, false, true, true); }).join('');
}

function doAudit(id, action) {
  JB.get(TECH_KEY, function(list) {
    if (!Array.isArray(list)) list = [];
    var tech = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) { tech = list[i]; break; }
    }
    if (!tech) { toast('未找到该记录'); return; }
    tech.status = action === 'approve' ? '已通过' : '已拒绝';
    tech.auditTime = Date.now();
    // 更新列表中对应项
    for (var j = 0; j < list.length; j++) {
      if (list[j].id === id) { list[j] = tech; break; }
    }
    JB.put(TECH_KEY, list, function(ok) {
      setCloudBadge(ok, ok ? '云端已连接' : '本地模式');
      toast(action === 'approve' ? '已通过 ✓' : '已拒绝 ✗');
      // 更新审核日志
      JB.get(LOG_KEY, function(logs) {
        if (!Array.isArray(logs)) logs = [];
        logs.unshift({
          id: tech.id,
          name: tech.name,
          phone: tech.phone,
          account: tech.account || '',
          action: action === 'approve' ? '通过' : '拒绝',
          time: Date.now()
        });
        if (logs.length > 500) logs = logs.slice(0, 500);
        JB.put(LOG_KEY, logs, function() { loadAll(); });
      });
    });
  });
}

function approve(id) { doAudit(id, 'approve'); }
function republishNotice(id) {
  var list = JB._getLocal(NOTICE_KEY);
  if (!Array.isArray(list)) list = [];
  var n = null, ni = -1;
  for (var i = 0; i < list.length; i++) { if (list[i].id === id) { n = list[i]; ni = i; break; } }
  if (!n) { toast('未找到该公告'); return; }
  n.time = Date.now();        // 刷新时间，首页自动置顶显示
  list.splice(ni, 1);
  list.unshift(n);            // 移到最前
  JB._setLocal(NOTICE_KEY, list);
  renderNotices(list);
  // 强力重试：3s/6s/12s 指数退避，最多3次
  var _nDelays = [3000, 6000, 12000];
  var _nAttempt = 0;
  function _nTryPush() {
    JB.put(NOTICE_KEY, list, function(putOk) {
      if (putOk) { setCloudBadge(true, '云端已连接'); toast('已重新发布'); }
      else if (_nAttempt < _nDelays.length) { var _w = _nDelays[_nAttempt]; _nAttempt++; setCloudBadge(false, '重试同步中...'); setTimeout(_nTryPush, _w); }
      else { setCloudBadge(false, '本地模式'); toast('已保存，联网后自动同步'); }
    });
  }
  _nTryPush();
}

function topTech(id) {
  JB.get(TECH_KEY, function(list) {
    if (!Array.isArray(list)) list = [];
    var tech = null, ti = -1;
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) { tech = list[i]; ti = i; break; } }
    if (!tech) { toast('未找到该技师'); return; }
    if (tech.top) { delete tech.top; toast('已取消置顶'); }
    else { tech.top = Date.now(); toast('已置顶，首页排第一'); }
    list[ti] = tech;
    JB._setLocal(TECH_KEY, list);
    renderAll(list);
    // 强力重试：3s/6s/12s 指数退避，最多3次
    var _d = [3000, 6000, 12000];
    var _a = 0;
    function _try() {
      JB.put(TECH_KEY, list, function(ok) {
        if (ok) { setCloudBadge(true, '云端已连接'); }
        else if (_a < _d.length) { var w = _d[_a]; _a++; setCloudBadge(false, '重试同步中...'); setTimeout(_try, w); }
        else { setCloudBadge(false, '本地模式'); }
      });
    }
    _try();
  });
}

function reject(id) { doAudit(id, 'reject'); }

// 删除技师（管理员操作）
function delTech(id) {
  if (!confirm('确定删除该技师？删除后首页不再展示，该技师个人中心也会清空！')) return;
  var list = JB._getLocal(TECH_KEY);
  var removed = null;
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) { removed = list[i]; break; }
  }
  list = list.filter(function(t) { return t.id !== id; });
  JB._setLocal(TECH_KEY, list);
  toast('已删除 ✓');
  loadAll();
  var cur = JB.getCurrentUser();
  if (cur && removed && removed.accountId === cur.id) {
    try { localStorage.removeItem('rose_technicians'); } catch(e) {}
  }
  JB.put(TECH_KEY, list, function(ok) {
    if (!ok) {
      setTimeout(function(){ JB.put(TECH_KEY, list, function(ok2){ setCloudBadge(ok2, ok2 ? '云端已连接' : '本地模式'); if(!ok2) toast('云端同步失败，已存本地'); }); }, 1500);
      setCloudBadge(false, '本地模式');
    } else {
      setCloudBadge(true, '云端已连接');
    }
  });
}

function renderHistory(logs) {
  var box = document.getElementById('historyList');
  if (logs.length === 0) { box.innerHTML = '<div class="empty">暂无审核记录</div>'; return; }
  box.innerHTML = logs.map(function(e) {
    var borderCls = e.action === '通过' ? '' : ' hist-reject';
    return '<div class="card hist-item' + borderCls + '"><div class="hist-name">' + escapeHtml(e.name) + ' 【' + escapeHtml(e.action) + '】</div><div class="hist-meta">电话：' + escapeHtml(e.phone || '') + ' | 账号：' + escapeHtml(e.account || '') + '</div><div class="hist-meta">' + formatTime(e.time) + '</div></div>';
  }).join('');
}

function switchTab(t) {
  document.getElementById('tabReview').className = 'tab' + (t === 'review' ? ' active' : '');
  document.getElementById('tabHistory').className = 'tab' + (t === 'history' ? ' active' : '');
  document.getElementById('tabAll').className = 'tab' + (t === 'all' ? ' active' : '');
  document.getElementById('tabNotice').className = 'tab' + (t === 'notice' ? ' active' : '');
  document.getElementById('reviewPanel').style.display = t === 'review' ? 'block' : 'none';
  document.getElementById('historyPanel').style.display = t === 'history' ? 'block' : 'none';
  document.getElementById('allPanel').style.display = t === 'all' ? 'block' : 'none';
  document.getElementById('noticePanel').style.display = t === 'notice' ? 'block' : 'none';
}

function previewNoticeImg(input, boxId) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var box = document.getElementById(boxId);
    box.innerHTML = '<img src="' + e.target.result + '" style="width:72px;height:72px;object-fit:cover;" onerror="imgErr(this)">';
  };
  reader.readAsDataURL(file);
}

function addNotice() {
  var title = document.getElementById('noticeTitle').value.trim();
  var content = document.getElementById('noticeContent').value.trim();
  if (!title || !content) { toast('请填写标题和内容'); return; }
  toast('正在发布...');
  // 收集3张图片
  var imgs = [];
  for (var i = 1; i <= 3; i++) {
    var box = document.getElementById('nImg' + i + 'Box');
    var img = box ? box.querySelector('img') : null;
    if (img) imgs.push(img.src);
  }
  JB.get(NOTICE_KEY, function(list, getOk) {
    if (!Array.isArray(list)) list = [];
    var newNotice = { id: JB.genId(), title: title, content: content, photos: imgs, time: Date.now() };
    list.unshift(newNotice);
    // 无论云端读取是否成功，都强制把最新公告推到云端（失败则本地兜底，限速重试后会自动同步）
    JB.put(NOTICE_KEY, list, function(putOk) {
      setCloudBadge(putOk, putOk ? '云端已连接' : '本地模式');
      if (putOk) {
        toast('公告已发布 ✓');
      } else {
        toast('已保存，联网后自动同步');
      }
      document.getElementById('noticeTitle').value = '';
      document.getElementById('noticeContent').value = '';
      // 清空图片预览
      for (var j = 1; j <= 3; j++) {
        document.getElementById('nImg' + j + 'Box').innerHTML = '+';
      }
      renderNotices(list);
    });
  });
}

function renderNotices(list) {
  var box = document.getElementById('noticeList');
  if (list.length === 0) { box.innerHTML = '<div class="empty">暂无公告</div>'; return; }
  box.innerHTML = list.map(function(n) {
    var photosHtml = '';
    if (n.photos && n.photos.length > 0) {
      photosHtml = '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;">';
      for (var pi = 0; pi < n.photos.length; pi++) {
        photosHtml += '<img src="' + n.photos[pi] + '" style="width:72px;height:72px;object-fit:cover;border-radius:8px;" onerror="imgErr(this)">';
      }
      photosHtml += '</div>';
    }
    return '<div class="card notice-item"><div style="flex:1;"><b style="font-size:15px;">' + escapeHtml(n.title) + '</b><div style="font-size:13px;color:#555;margin-top:6px;white-space:pre-wrap;line-height:1.5;">' + escapeHtml(n.content) + '</div>' + photosHtml + '<div style="font-size:11px;color:#bbb;margin-top:8px;">' + formatTime(n.time) + '</div></div><div class="notice-del" <div style="display:flex;gap:12px;white-space:nowrap;"><div class="notice-del" style="color:#FF9800;" onclick="republishNotice(\'' + n.id + '\')">重新发布</div><div class="notice-del" onclick="delNotice(\'' + n.id + '\')">删除</div></div></div>';
  }).join('');
}

function delNotice(id) {
  if (!confirm('确定删除该公告？')) return;
  var list = JB._getLocal(NOTICE_KEY);
  list = list.filter(function(n) { return n.id !== id; });
  JB._setLocal(NOTICE_KEY, list);
  toast('已删除 ✓');
  renderNotices(list);
  JB.put(NOTICE_KEY, list, function(ok) {
    if (!ok) {
      setTimeout(function(){ JB.put(NOTICE_KEY, list, function(ok2){ setCloudBadge(ok2, ok2 ? '云端已连接' : '本地模式'); if(!ok2) toast('云端同步失败，已存本地'); }); }, 1500);
      setCloudBadge(false, '本地模式');
    } else {
      setCloudBadge(true, '云端已连接');
    }
  });
}

// 自动检测云端连接状态
(function checkCloud() {
  JB.get('accounts', function(data) {
    cloudOk = Array.isArray(data);
    setCloudBadge(cloudOk, cloudOk ? '云端已连接' : '本地模式');
  });
})();

// 已登录则直接进入后台
var _adminLogged = false;
try { _adminLogged = localStorage.getItem('rose_admin_logged') === '1'; } catch(e) { _adminLogged = false; }
if (_adminLogged) {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('adminView').style.display = 'block';
  loadAll();
}
</script>

<script>
// 注册 Service Worker (PWA)
if ('serviceWorker' in navigator) {
  try {
    navigator.serviceWorker.register('sw.js?v=20260817')
      .then(function(reg) { console.log('[PWA] SW 注册成功:', reg.scope); })
      .catch(function(err) { console.log('[PWA] SW 注册失败:', err); });
  } catch (e) { console.warn('[PWA] SW 不可用（沙箱/隐私模式）', e); }
}
</script>
</body>
